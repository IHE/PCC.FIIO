id: ihe.pcc.ips
canonical: https://profiles.ihe.net/PCC/IPS
version: 2.0.0
# making version 2.0.0 to align with the version of the HL7 IPS IG that is being used as the base for this implementation guide.
name: IHE_PCC_IPS
title: "FHIR International Patient Summary"
description: Additional options for implementing the HL7 International Patient Summary FHIR document and associated testing requirements. 
#releaseLabel: ci-build
releaseLabel: trial-use
#releaseLabel: trial-use
#releaseLabel: release
date: 2026-03-03
status: active
publisher:
  - name: IHE Patient Care Coordination Committee
  - url: https://www.ihe.net/ihe_domains/patient_care_coordination/
  - email: pcc@ihe.net
contact:
  - name: IHE Patient Care Coordination Technical Committee
    telecom:
      - system: email
        value: pcc@ihe.net
license:  CC-BY-4.0
fhirVersion: 4.0.1
jurisdiction: 'http://unstats.un.org/unsd/methods/m49/m49.htm#001'
#copyright: IHE http://www.ihe.net/Governance/#Intellectual_Property
copyrightYear: 2021+

dependencies:
  hl7.fhir.uv.ips:
    id: hl7ips
    uri: http://hl7.org/fhir/uv/ips/ImplementationGuide/hl7.fhir.uv.ips
    version: 2.0.x
    reason: |
      Base HL7 IPS profiles that the IHE IPS profiles and options constrain.
  ihe.pcc.odh: 
    id: ihepccodh
    uri: https://profiles.ihe.net/PCC/ODH/ImplementationGuide/ihe.pcc.odh
    version: 1.0.x
    reason: |
      Occupational Data for Health content used by the ODH Option.
  # Pan-Canadian Patient Summary: Canadian National Extension and PS-CA examples only (brings in hl7.fhir.ca.baseline)
  ca.infoway.io.psca:
    id: psca
    uri: http://fhir.infoway-inforoute.ca/io/psca/ImplementationGuide/ca.infoway.io.psca
    version: 2.1.1-DFT
    reason: |
      Used only for the Canadian National Extension (Volume 4) and the PS-CA examples. It is not required to implement the IHE IPS profiles or options.
  # United States Patient Care Summary: USA National Extension and US-PCS examples only (brings in hl7.fhir.us.core)
  hl7.fhir.us.pcs:
    id: uspcs
    uri: http://hl7.org/fhir/us/pcs/ImplementationGuide/hl7.fhir.us.pcs
    version: 1.0.x
    reason: |
      Used only for the USA National Extension (Volume 4) and the US-PCS examples. It is not required to implement the IHE IPS profiles or options.
  # HL7 US Occupational Data for Health: USA National Extension and US-PCS examples only (brings in hl7.fhir.us.core 5.0.1 and us.cdc.phinvads)
  hl7.fhir.us.odh:
    id: usodh
    uri: http://hl7.org/fhir/us/odh/ImplementationGuide/hl7.fhir.us.odh
    version: 1.3.0
    reason: |
      Used only for the USA National Extension (Volume 4) and the US-PCS examples. It is not required to implement the IHE IPS profiles or options.
  hl7.fhir.uv.extensions.r4:
    id: FHIRExtensionPack
    uri: http://hl7.org/fhir/extensions/ImplementationGuide/hl7.fhir.uv.extensions
    version: 5.3.0
    reason: |
      FHIR extensions used by the IHE IPS profiles and examples.

parameters:  
  path-resource:
    - input/resources
    - fsh/resources
    - fsh/examples
#  path-pages:
#    - input/pagecontent
#    - fsh-generated/includes
  # Pin canonical references that resolve to more than one loaded version (IPS 2.0.0-ballot and 2.0.1, US Core 5.0.1 and 6.1.0), for example the
  # baseDefinition and inherited constraint sources of the IHE IPS profiles
  pin-canonicals: pin-multiples
  show-inherited-invariants: 'false'
  usage-stats-opt-out: 'false'
  logging: progress
  shownav: 'true'
  active-tables: 'false'
  apply-contact: 'true'
  apply-jurisdiction: 'true'
  apply-publisher: 'true'
  apply-version: 'true'

groups:
# Artifacts page groupings, in the order they appear on artifacts.html
  ODHOptionProfiles:
    name: ODH Option Profiles
    description: Profiles for the IPS Occupational Data for Health (ODH) Implementation Option.
    resources:
      - StructureDefinition/IHE.IPS.ODH.Option.Bundle
      - StructureDefinition/IHE.IPS.ODH.Option.Composition
  CompleteOptionProfiles:
    name: Complete Option Profiles
    description: Profiles for the IPS Complete Implementation Option.
    resources:
      - StructureDefinition/IHE.IPS.Complete.Option.Bundle
      - StructureDefinition/IHE.IPS.Complete.Option.Composition
  BaseIPSExamples:
    name: Base IPS Examples
    description: |-
      Example IPS documents that align with the minimum requirements of the base HL7 FHIR International Patient Summary (IPS). All examples in the groups below are also intended to conform to the base IPS requirements and declare the HL7 IPS Bundle and Composition profiles. They are not repeated in this group to avoid duplicating artifacts.
    resources:
      - Bundle/ex-Bundle-IPS-Frank-MissingData
      - Composition/ex-Composition-IPS-Frank-MissingData
  ODHOptionExamples:
    name: ODH Option Examples
    description: Example IPS documents that conform to the ODH Option.
    resources:
      - Bundle/ex-Bundle-IPS-ODH-Judy-Jobs
      - Composition/ex-Composition-IPS-ODH-Judy-Jobs
  CompleteOptionExamples:
    name: Complete Option Examples
    description: Example IPS documents that conform to the Complete Option.
    resources:
      - Bundle/ex-Bundle-IPS-Complete-Jannet-Guo
      - Composition/ex-Composition-IPS-Complete-Jannet-Guo
  SecondaryUseExamples:
    name: Secondary Use Examples
    description: |-
      Example IPS documents for Use Case #6, Secondary Use of IPS for Standardized Data Exchange. They show one patient record at each stage of the de-identification process described in the [IHE ITI De-Identification Handbook](https://profiles.ihe.net/ITI/DeId/):
      - **Identifiable record:** the primary care IPS document extracted for the study cohort, with all identifiers and clinical content.
      - **Stage 1 (pseudonymized):** direct identifiers are removed according to the approved de-identification method. A pseudo-identifier and pseudo-name replace the patient identifier and name throughout the document, and all clinical content remains.
      - **Stage 2 (de-identified):** indirect identifiers are removed, masked, or obfuscated according to the approved de-identification method, leaving enough clinical content to conduct the research study. This is the record delivered to the researcher in the standard IPS format.

      The handbook includes a complete IPS de-identification example under [IPS EHDS2](https://profiles.ihe.net/ITI/DeId/ips-ehds-example.html).
    resources:
      - Bundle/80c516fd-9c84-4924-875b-bf0048979ae1
      - Composition/ex-Composition-secondaryUse-pandemicIPS
      - Bundle/430e32bc-be3e-4c42-a17b-461ea4f402d4
      - Composition/ex-Composition-secondaryUse-pandemicIPS-stage-1
      - Bundle/6603561c-2888-4355-9df4-23675f6eb458
      - Composition/ex-Composition-secondaryUse-pandemicIPS-stage-2
  USNationalExtensionExamples:
    name: US National Extension Examples
    description: Example IPS documents that conform to the United States Patient Care Summary (US-PCS) and the IHE IPS options.
    resources:
      - Bundle/ex-Bundle-USPCS-Complete-Aaron-Morales
      - Composition/ex-Composition-USPCS-Aaron-Morales
  CanadianNationalExtensionExamples:
    name: Canadian National Extension Examples
    description: Example IPS documents that conform to the Pan-Canadian Patient Summary (PS-CA) and the IHE IPS options.
    resources:
      - Bundle/ex-Bundle-PSCA-Complete-Sansa-Stark
      - Composition/ex-Composition-PSCA-Sansa-Stark

